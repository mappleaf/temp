name: Export PBV

on:
  push:
    paths:
      - ".github/workflows/pbv-export.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct PBV
        run: |
          cat encoded-20260922003545-1.txt encoded-20260922003545-2.txt | base64 -d > CoCo-reconstructed.pbv
          sha256sum CoCo-reconstructed.pbv
      - name: Upload reconstructed PBV
        uses: actions/upload-artifact@v4
        with:
          name: CoCo-pbv
          path: CoCo-reconstructed.pbv
          retention-days: 1
